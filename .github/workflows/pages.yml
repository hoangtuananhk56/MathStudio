# Builds the add-in and publishes it on GitHub Pages, with its manifest
# (https://<user>.github.io/<repo>/manifest.xml). Enable it once in the repository:
# Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Publish add-in

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Manifest for this site
        run: node scripts/make-manifest.mjs "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
      - run: npx office-addin-manifest validate dist/manifest.xml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
