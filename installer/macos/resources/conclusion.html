<h2>Đã cài xong</h2>
<p>Mở Word, vào <b>Chèn → Bổ trợ → Bổ trợ của tôi</b> (Insert → Add-ins → My Add-ins), chọn <b>MathStudio</b>.
Từ lần sau tab MathStudio có sẵn trên thanh công cụ.</p>
<p>Gỡ cài đặt: mở thư mục <i>/Library/Application Support/MathStudio</i> và nhấp đúp
<b>Uninstall MathStudio.command</b>.</p>
</body>
